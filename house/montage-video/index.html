<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F3F0EA; font-family: "Inter", sans-serif; color: #1E1B18; }
      #bg { position: absolute; inset: 0; background: #F3F0EA; }
      #intro, #outro { position: absolute; inset: 0; background: #F3F0EA; }
      #intro-in { position: absolute; left: 80px; right: 80px; top: 560px; }
      .k { font-size: 24px; font-weight: 700; letter-spacing: .16em; color: #8A6230; }
      .t { font-size: 104px; font-weight: 700; letter-spacing: -0.035em; line-height: 0.98; margin-top: 22px; }
      .d { font-size: 30px; color: #5E574E; margin-top: 26px; line-height: 1.35; }
      .list { margin-top: 64px; border-top: 2px solid #1E1B18; }
      .li { display: flex; gap: 22px; align-items: baseline; font-size: 30px; padding: 16px 0; border-bottom: 1px solid #D8D1C5; }
      .li b { font-size: 20px; color: #8A6230; letter-spacing: .1em; width: 40px; }
      #bar { position: absolute; left: 40px; right: 40px; top: 30px; display: flex; gap: 8px; z-index: 100; }
      .seg { flex: 1; height: 6px; border-radius: 3px; background: #DDD6CA; overflow: hidden; }
      .seg i { display: block; height: 100%; background: #1E1B18; transform-origin: 0% 50%; transform: scaleX(0); }
      #chap { position: absolute; right: 40px; top: 46px; font-size: 28px; font-weight: 700; letter-spacing: .08em; color: #5E574E; z-index: 100; font-variant-numeric: tabular-nums; }
      #sheet { position: absolute; left: 90px; top: 250px; width: 900px; box-shadow: 0 30px 80px rgba(30, 27, 24, .18); }
      #outro-cap { position: absolute; left: 80px; right: 80px; top: 92px; }
      #outro-cap .t { font-size: 64px; }
      #outro-foot { position: absolute; left: 80px; right: 80px; bottom: 120px; font-size: 24px; color: #5E574E; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.1" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="3.3499999999999996" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      
      <video id="v-axo" class="clip" src="assets/axo.mp4" muted playsinline data-start="3.10" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:2"></video>
      <img id="h-axo" class="clip" src="assets/axo-last.png" alt="" data-start="6.10" data-duration="0.9" data-track-index="3"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:3">
      <video id="v-section" class="clip" src="assets/section.mp4" muted playsinline data-start="6.80" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:4"></video>
      <img id="h-section" class="clip" src="assets/section-last.png" alt="" data-start="9.80" data-duration="0.9" data-track-index="5"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:5">
      <video id="v-poche" class="clip" src="assets/poche.mp4" muted playsinline data-start="10.50" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:6"></video>
      <img id="h-poche" class="clip" src="assets/poche-last.png" alt="" data-start="13.50" data-duration="0.9" data-track-index="4"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:7">
      <video id="v-zoning" class="clip" src="assets/zoning.mp4" muted playsinline data-start="14.20" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:8"></video>
      <img id="h-zoning" class="clip" src="assets/zoning-last.png" alt="" data-start="17.20" data-duration="0.9" data-track-index="3"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:9">
      <video id="v-routes" class="clip" src="assets/routes.mp4" muted playsinline data-start="17.90" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:10"></video>
      <img id="h-routes" class="clip" src="assets/routes-last.png" alt="" data-start="20.90" data-duration="0.9" data-track-index="5"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:11">
      <video id="v-shadows" class="clip" src="assets/shadows.mp4" muted playsinline data-start="21.60" data-duration="3" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:12"></video>
      <img id="h-shadows" class="clip" src="assets/shadows-last.png" alt="" data-start="24.60" data-duration="0.9" data-track-index="4"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:contain;z-index:13">
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="25.30" data-duration="4.8" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:14"></div>
      <div id="bar"><div class="seg"><i id="p-axo"></i></div><div class="seg"><i id="p-section"></i></div><div class="seg"><i id="p-poche"></i></div><div class="seg"><i id="p-zoning"></i></div><div class="seg"><i id="p-routes"></i></div><div class="seg"><i id="p-shadows"></i></div></div>
      <div id="chap"></div>
    </div>
    <script>
      (function () {
        const CH = [{"id":"axo","s":3.1},{"id":"section","s":6.8},{"id":"poche","s":10.5},{"id":"zoning","s":14.2},{"id":"routes","s":17.9},{"id":"shadows","s":21.6}];
        const STEP = 3.7, FADE = 0.25, OUT0 = 25.30;
        const tl = gsap.timeline({ paused: true });
        for (const c of CH) tl.fromTo("#v-" + c.id, { opacity: 0 }, { opacity: 1, duration: FADE, ease: "power1.out" }, c.s);
        // прогресс и номер главы — функция времени
        const chap = document.getElementById("chap"), segs = CH.map((c) => document.getElementById("p-" + c.id));
        const bar = document.getElementById("bar");
        function paint() {
          const t = tl.time();
          let cur = -1;
          CH.forEach((c, i) => {
            const p = Math.min(1, Math.max(0, (t - c.s) / STEP));
            segs[i].style.transform = "scaleX(" + p.toFixed(4) + ")";
            if (t >= c.s) cur = i;
          });
          const show = cur >= 0 && t < OUT0;
          bar.style.opacity = show ? 1 : 0; chap.style.opacity = show ? 1 : 0;
          chap.textContent = cur >= 0 ? "0" + (cur + 1) + " / 0" + CH.length : "";
        }
        tl.fromTo({ v: 0 }, { v: 0 }, { v: 1, duration: 30.1, ease: "none", onUpdate: paint }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
